# Owner-testing preview: the web app on GitHub Pages and an installable Android APK.
# Manual only. This is NOT a production release (no store upload, no announcement).
name: Preview build
on:
  workflow_dispatch:
    inputs:
      android:
        description: Also rebuild the Android APK
        type: boolean
        default: true
      cancel_pages_deployment:
        description: Commit SHA of a stuck GitHub Pages deployment to cancel first (optional)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: preview
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.6"
  NODE_VERSION: "22"

jobs:
  web:
    name: Web preview (GitHub Pages)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - run: touch out/.nojekyll
      - name: Cancel a stuck Pages deployment
        if: ${{ inputs.cancel_pages_deployment != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.cancel_pages_deployment }}
          REPO: ${{ github.repository }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "not a commit SHA"; exit 1; }
          gh api -X POST "repos/$REPO/pages/deployments/$SHA/cancel" || true
          sleep 15
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: apps/web/out }
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        # ~3,000 pre-rendered files: the first sync can exceed the 10-minute default.
        with: { timeout: 2400000 }

  android:
    name: Android preview APK
    if: ${{ inputs.android }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk rattil-preview.apk
      - name: Publish to the "preview" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view preview >/dev/null 2>&1 || gh release create preview --prerelease \
            --title "Preview build (owner testing, not a store release)" \
            --notes "Test build for the project owner. Not reviewed for public release."
          gh release upload preview rattil-preview.apk --clobber
