# Every push / PR runs the full gate. Nothing here deploys: production releases
# need explicit project-owner approval (see docs/RELEASE_PROCESS.md).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # weekly: full browser matrix + security scans
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  FLUTTER_VERSION: "3.41.6"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.13"

jobs:
  content:
    name: Content integrity (Quran hashes, pages, tokens)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: python tools/build_content.py
      - run: python packages/design-tokens/scripts/build.py
      - name: Generated files must be committed and deterministic
        run: git diff --exit-code -- content packages/design-tokens/dist

  backend:
    name: Backend (FastAPI) tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/api } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: services/api/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt pip-audit
      - run: ruff check . && ruff format --check .
      - run: python scripts/export_openapi.py --check
      - run: pytest -p no:warnings --cov --cov-report=xml --cov-fail-under=90 --junitxml=junit.xml
      - run: pip-audit -r requirements.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: backend-reports, path: "services/api/junit.xml\nservices/api/coverage.xml" }

  web:
    name: Web (Next.js PWA) — unit, e2e, a11y
    runs-on: ubuntu-latest
    needs: backend
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: pip install -r ../../services/api/requirements.txt
      - run: npm ci
      - run: npm run lint && npm run typecheck
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: End-to-end (Chromium, Firefox, WebKit)
        env: { E2E_BROWSERS: "chromium,firefox,webkit", API_PYTHON: python }
        run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: web-reports, path: "tests/evidence/web\napps/web/test-results" }

  mobile-android:
    name: Flutter Android — analyze, test, APK, emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test --coverage
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: android-debug-apk, path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Integration tests on Android emulator (API 34)
        timeout-minutes: 40
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: apps/mobile
          script: ./tool/run_integration.sh

  mobile-ios:
    name: Flutter iOS — build + simulator integration tests
    # macOS runners are scarce: run on main, manual runs and the weekly schedule,
    # not on every dependency-bump PR.
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    runs-on: macos-15
    timeout-minutes: 60
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter test
      - run: flutter build ios --simulator --debug --no-codesign
      - name: Boot an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - run: ./tool/run_integration.sh -d ${{ steps.sim.outputs.udid }}
        timeout-minutes: 25

  security:
    name: Security scans (Semgrep, secrets, dependencies)
    runs-on: ubuntu-latest
    container: { image: semgrep/semgrep }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - run: semgrep scan --config p/default --config p/python --config p/typescript --config p/secrets --metrics=off --error --exclude content --exclude tests/evidence

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
