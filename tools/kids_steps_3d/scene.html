const root = new THREE.Group(); scene.add(root);

const UP = new THREE.Vector3(0, 1, 0);
function capsule(a, b, r, m) {
  const d = b.clone().sub(a); const len = d.length();
  const g = new THREE.CapsuleGeometry(r, Math.max(len, 0.0001), 8, 24);
  const mesh = new THREE.Mesh(g, m);

}

// Two-bone IK: the middle joint for a chain from a to t, bending toward pole.
function ik(a, t, l1, l2, pole) {
  const d = t.clone().sub(a); let dist = d.length();
  dist = Math.min(Math.max(dist, Math.abs(l1 - l2) + 1e-3), l1 + l2 - 1e-3);
  const dir = d.normalize();
  const x = (l1 * l1 - l2 * l2 + dist * dist) / (2 * dist);
  const h = Math.sqrt(Math.max(l1 * l1 - x * x, 0));
  const pv = pole.clone().sub(a); pv.sub(dir.clone().multiplyScalar(pv.dot(dir))).normalize();
  return { mid: a.clone().add(dir.clone().multiplyScalar(x)).add(pv.multiplyScalar(h)), end: a.clone().add(dir.multiplyScalar(dist)) };
}

// ---------------- Props ----------------
function wuduStation() {

}

// ---------------- Child ----------------
const yaw = P.yaw ?? 0;
const L = (v) => V(v).applyAxisAngle(UP, yaw);   // body-local → world (feet origin)
const LEN = { thigh: 0.33, shin: 0.31, upper: 0.22, fore: 0.21, torso: 0.4, neck: 0.05, headR: 0.165 };

const pelvis = L(P.pelvis);
const chest = P.chest ? L(P.chest) : pelvis.clone().add(new THREE.Vector3(0, LEN.torso, 0));
const tUp = chest.clone().sub(pelvis).normalize();
const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(UP, yaw);    // child's left
const sideT = side.clone().sub(tUp.clone().multiplyScalar(side.dot(tUp))).normalize();
const fwdT = new THREE.Vector3().crossVectors(sideT, tUp).normalize();  // torso forward

// Head frame
const hPitch = P.headPitch ?? 0, hYaw = P.headYaw ?? 0, hRoll = P.headRoll ?? 0;
const qHead = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(sideT, tUp, fwdT));

const inHead = (o) => headC.clone().add(hx.clone().multiplyScalar(o[0] * HK)).add(hy.clone().multiplyScalar(o[1] * HK)).add(hz.clone().multiplyScalar(o[2] * HK));

const target = (t) => t.head ? inHead(t.head) : t.torso ? inTorso(t.torso)
  : t.lArm !== undefined ? arms.l.mid.clone().lerp(arms.l.end, t.lArm).add(new THREE.Vector3(0, t.up ?? 0.05, 0)) : L(t);

// Torso: a soft robe shape from the hips to the shoulders.
{
  const prof = [];
  const pts = [[0.0, -0.06], [0.15, -0.05], [0.165, 0.05], [0.155, 0.2], [0.15, 0.32], [0.13, 0.4], [0.08, 0.45], [0.0, 0.46]];
  for (const [r, y] of pts) prof.push(new THREE.Vector2(r, y));
  const g = new THREE.LatheGeometry(new THREE.SplineCurve(prof).getPoints(40), 48);
  const m = add(new THREE.Mesh(g, mat.robe));
  m.position.copy(pelvis);
  m.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(sideT, tUp, fwdT));
  m.scale.set(1, (chest.distanceTo(pelvis)) / LEN.torso, 0.82);
  // collar + buttons placket
  const col = add(new THREE.Mesh(new THREE.TorusGeometry(0.06, 0.012, 12, 32), mat.kufiBand));
  col.position.copy(neckTop.clone().add(tUp.clone().multiplyScalar(-0.035)));
  col.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), tUp);
  for (let i = 0; i < 3; i++) sphere(inTorso([0, 0.36 - i * 0.05, 0.135 - i * 0.002]), 0.01, mat.kufiBand);
}
// Neck
capsule(chest, neckTop.clone().add(tUp.clone().multiplyScalar(0.03)), 0.045, mat.skin);
// Head, hair, kufi, ears (no face is drawn)
{
  const h = sphere(headC, LEN.headR, mat.skin, [1, 1.04, 0.98]); h.quaternion.copy(qHead);
  const hair = add(new THREE.Mesh(new THREE.SphereGeometry(LEN.headR * 1.02, 40, 24, 0, Math.PI * 2, 0, 1.55), mat.hair));
  hair.position.copy(headC); hair.quaternion.copy(qHead).multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(-1.0, 0, 0)));
  // White crocheted taqiyah: a round cap that covers the crown down to above the ears.
  const kufi = add(new THREE.Mesh(new THREE.SphereGeometry(LEN.headR * 1.07, 48, 24, 0, Math.PI * 2, 0, 1.2), mat.kufi));
  kufi.position.copy(headC); kufi.scale.set(1, 1.02, 1.03);
  kufi.quaternion.copy(qHead).multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(-0.32, 0, 0)));
  const rim = add(new THREE.Mesh(new THREE.TorusGeometry(LEN.headR * 1.07 * Math.sin(1.2), 0.008, 10, 64), mat.kufi));
  rim.position.copy(headC.clone().add(new THREE.Vector3(0, LEN.headR * 1.07 * 1.02 * Math.cos(1.2), 0).applyQuaternion(kufi.quaternion)));
  rim.quaternion.copy(kufi.quaternion).multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.PI / 2, 0, 0)));
  for (const s of [1, -1]) {
    const e = sphere(inHead([s * LEN.headR * 0.97, -0.035, -0.01]), 0.042, mat.skin, [0.55, 1, 0.8]);
    e.quaternion.copy(qHead);
  }
}
// Arms
for (const s of [1, -1]) {
  const key = s > 0 ? 'l' : 'r';
  const sh = inTorso([s * 0.16, 0.38, 0]);
  const t = target(P[key + 'Hand']);
  const pole = target(P[key + 'Elbow'] ?? { torso: [s * 0.5, 0.1, -0.3] });
  const { mid, end } = ik(sh, t, LEN.upper, LEN.fore, pole);
  arms[key] = { mid, end };
  if (P[key + 'SleeveUp']) {
    // Sleeve rolled up above the elbow: the whole forearm and elbow show (washing to the elbows).
    const roll = sh.clone().add(mid.clone().sub(sh).multiplyScalar(0.6));
    capsule(sh, roll, 0.055, mat.robe);

    const cuff = mid.clone().add(end.clone().sub(mid).multiplyScalar(0.55));
    capsule(mid, cuff, 0.05, mat.robe);
    capsule(cuff, end, 0.032, mat.skin);

  let pn = (P[key + 'Palm'] ? (P[key + 'Palm'].torso ? inTorso(P[key + 'Palm'].torso).sub(pelvis) : V(P[key + 'Palm']).applyAxisAngle(UP, yaw)) : inward).normalize();

  palm.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(across, d, pn));
  const curl = P[key + 'Curl'] ?? 0.15;
  const point = P[key + 'Point'];
  for (let f = 0; f < 4; f++) {
    const off = (f - 1.5) * 0.0145;
    const base = palmC.clone().add(d.clone().multiplyScalar(0.03)).add(across.clone().multiplyScalar(off * s));
    const len = [0.036, 0.042, 0.04, 0.032][f] * 1.05;

    const dir = d.clone().multiplyScalar(Math.cos(c)).add(pn.clone().multiplyScalar(Math.sin(c))).normalize();
    capsule(base, base.clone().add(dir.multiplyScalar(len)), 0.0075, mat.skin);
  }
  const tb = palmC.clone().add(across.clone().multiplyScalar(-0.028 * s)).add(d.clone().multiplyScalar(-0.012));
  capsule(tb, tb.clone().add(d.clone().multiplyScalar(0.028)).add(across.clone().multiplyScalar(-0.014 * s)).add(pn.clone().multiplyScalar(0.012)), 0.0085, mat.skin);
}
// Legs
const robeLegs = P.skirt ? mat.robe : mat.robe;
for (const s of [1, -1]) {
  const key = s > 0 ? 'l' : 'r';
  const hip = inTorso([s * 0.075, 0.02, 0]);
  const ft = target(P[key + 'Foot']);
  const pole = target(P[key + 'Knee'] ?? [s * 0.05, 0.4, 1]);
  const { mid, end } = ik(hip, ft, LEN.thigh, LEN.shin, pole);
  if (!P.skirt) {
    capsule(hip, mid, 0.075, robeLegs);
    capsule(mid, end.clone().add(mid.clone().sub(end).normalize().multiplyScalar(0.04)), 0.065, robeLegs);
  }
  capsule(end.clone().add(mid.clone().sub(end).normalize().multiplyScalar(0.04)), end, 0.04, mat.skin);
  // Foot points along footDir (default: child's forward).
  const fd = (P[key + 'FootDir'] ? V(P[key + 'FootDir']).applyAxisAngle(UP, yaw) : new THREE.Vector3(0, 0, 1).applyAxisAngle(UP, yaw)).normalize();
  capsule(end.clone().add(fd.clone().multiplyScalar(-0.02)), end.clone().add(fd.clone().multiplyScalar(0.1)), 0.04, mat.skin);
}
if (P.skirt) {
  // Long thobe skirt from the hips to the ankles when standing.
  const prof = [[0.0, 0.0], [0.17, 0.0], [0.19, -0.2], [0.21, -0.45], [0.215, -0.56], [0.0, -0.56]].map(([r, y]) => new THREE.Vector2(r, y));
  const g = new THREE.LatheGeometry(prof, 48);
  const m = add(new THREE.Mesh(g, mat.robe)); m.position.copy(pelvis.clone().add(new THREE.Vector3(0, 0.02, 0)));

// ---------------- Scene ----------------
function room() {
  const salah = P.scene === 'salah';
  const wallTex = noiseTex((g, n) => {
    g.fillStyle = salah ? '#efe4cf' : '#f4f1ea'; g.fillRect(0, 0, n, n);
    for (let i = 0; i < 900; i++) { g.fillStyle = `rgba(120,100,70,${Math.random() * 0.04})`; g.fillRect(Math.random() * n, Math.random() * n, 4, 4); }
  }, 256, 3);
  wallTex.colorSpace = THREE.SRGBColorSpace;
  const dadoTex = noiseTex((g, n) => {
    g.fillStyle = salah ? '#8a5a3a' : '#cfe9e6'; g.fillRect(0, 0, n, n);
    if (salah) { for (let x = 0; x < n; x += 32) { g.fillStyle = '#7a4c30'; g.fillRect(x, 0, 3, n); } }

  }, 256, 4);
