name: rattil
description: "Rattil (رتّل) — free Quran, Mushaf and prayer-times app. No ads, no subscriptions, no purchases."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4
  flutter: 3.41.6

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.5.6
  http: ^1.6.0
  xml: ^7.0.1
  timezone: ^0.11.2
  crypto: ^3.0.8
  just_audio: ^0.10.6
  # Lock-screen / notification controls and background recitation (Android media service).
  audio_service: ^0.18.18
  # Long-press shortcuts on the app icon.
  quick_actions: ^1.1.0
  flutter_local_notifications: ^22.3.2
  sensors_plus: ^7.1.1
  hijri: ^3.0.1
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.10.0
  webview_flutter_wkwebview: ^3.23.0
  url_launcher: ^6.3.2
  geolocator: ^14.0.2
  share_plus: ^12.0.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/content/
    - assets/schemas/
    - assets/audio/
  fonts:
    - family: Amiri Quran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
