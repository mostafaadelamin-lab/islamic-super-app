include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 120

analyzer:
  exclude:
    - lib/l10n/app_localizations*.dart
    - lib/theme/design_tokens.dart
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - prefer_single_quotes
    - always_declare_return_types
    - avoid_print
    - prefer_final_locals
    - unawaited_futures
